<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" width="1254" height="1254" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <path id="slab" d="M -51.8,-181.8 Q 0,-212 51.8,-181.8 L 330.2,-19.2 Q 363,0 330.2,19.2 L 51.8,181.8 Q 0,212 -51.8,181.8 L -330.2,19.2 Q -363,0 -330.2,-19.2 Z"/>

    <!-- Layer 1 (frosted top) -->
    <linearGradient id="f1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a69383"/>
      <stop offset="0.6" stop-color="#b89f89"/>
      <stop offset="1" stop-color="#c8a687"/>
    </linearGradient>
    <linearGradient id="e1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8c8b0"/>
      <stop offset="0.5" stop-color="#f6dccb"/>
      <stop offset="1" stop-color="#e6c6b0"/>
    </linearGradient>

    <!-- Layer 2 (red) -->
    <linearGradient id="f2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d3a2e"/>
      <stop offset="1" stop-color="#b0604a"/>
    </linearGradient>
    <linearGradient id="e2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5a36"/>
      <stop offset="0.5" stop-color="#ff6a45"/>
      <stop offset="1" stop-color="#ff5a36"/>
    </linearGradient>

    <!-- Layer 3 (orange) -->
    <linearGradient id="f3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f5421"/>
      <stop offset="1" stop-color="#c98a3a"/>
    </linearGradient>
    <linearGradient id="e3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9a1f"/>
      <stop offset="0.5" stop-color="#ffb23a"/>
      <stop offset="1" stop-color="#ffa51f"/>
    </linearGradient>

    <!-- Layer 4 (khaki) -->
    <linearGradient id="f4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3e2c"/>
      <stop offset="1" stop-color="#6b5a3e"/>
    </linearGradient>
    <linearGradient id="e4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8a67c"/>
      <stop offset="0.5" stop-color="#d6c295"/>
      <stop offset="1" stop-color="#b8a67c"/>
    </linearGradient>

    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <clipPath id="clip1">
      <use href="#slab" transform="translate(625 455)"/>
    </clipPath>
  </defs>

  <!-- App tile -->
  <rect x="85" y="93" width="1080" height="1070" rx="310" ry="310" fill="#1d2021"/>

  <!-- Layer 4 -->
  <use href="#slab" transform="translate(625 771)" fill="url(#e4)"/>
  <use href="#slab" transform="translate(625 757)" fill="url(#f4)"/>
  <use href="#slab" transform="translate(625 757)" fill="none" stroke="#c9b88c" stroke-opacity="0.55" stroke-width="2.5"/>

  <!-- Layer 3 -->
  <use href="#slab" transform="translate(625 671)" fill="url(#e3)"/>
  <use href="#slab" transform="translate(625 657)" fill="url(#f3)"/>
  <use href="#slab" transform="translate(625 657)" fill="none" stroke="#ffb03a" stroke-opacity="0.6" stroke-width="2.5"/>

  <!-- Layer 2 -->
  <use href="#slab" transform="translate(625 571)" fill="url(#e2)"/>
  <use href="#slab" transform="translate(625 557)" fill="url(#f2)"/>
  <use href="#slab" transform="translate(625 557)" fill="none" stroke="#ff6a45" stroke-opacity="0.6" stroke-width="2.5"/>

  <!-- Layer 1 (frosted top) -->
  <use href="#slab" transform="translate(625 469)" fill="url(#e1)"/>
  <use href="#slab" transform="translate(625 455)" fill="url(#f1)"/>

  <!-- Glow of the layers seen through the frosted glass -->
  <g clip-path="url(#clip1)">
    <g filter="url(#blur)">
      <use href="#slab" transform="translate(625 560) scale(0.85)" fill="#e0614a" fill-opacity="0.55"/>
      <use href="#slab" transform="translate(625 585) scale(0.6)" fill="#d9946a" fill-opacity="0.55"/>
      <use href="#slab" transform="translate(625 610) scale(0.35)" fill="#c9a57e" fill-opacity="0.6"/>
    </g>
  </g>

  <!-- Top layer rim highlight -->
  <use href="#slab" transform="translate(625 455)" fill="none" stroke="#f3d9c8" stroke-opacity="0.75" stroke-width="3"/>
</svg>
