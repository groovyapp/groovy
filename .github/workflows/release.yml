name: Release

# A tag like v0.1.0 builds the Linux AppImage and an unsigned Windows zip, and attaches both to a
# GitHub release for the tag, each with a SHA-256 checksum file. The builds are not signed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux AppImage
    # The oldest supported Ubuntu, so the AppImage runs on older distributions too: it links to
    # the system's glibc and graphics libraries.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libfontconfig-dev libwayland-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libvulkan-dev libssl-dev libzstd-dev libdbus-1-dev pkg-config \
            xvfb mesa-vulkan-drivers libfuse2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build the AppImage
        run: scripts/package-appimage.sh

      # Starts the AppImage on a virtual X display with a software GPU. Not yet proven on
      # GitHub's runners, so it reports without blocking the release.
      - name: Smoke test
        continue-on-error: true
        run: xvfb-run -a scripts/smoke-test-linux.sh dist/*.AppImage

      # Lets people check a download against the release, since the files aren't signed.
      - name: Write the checksum
        working-directory: dist
        run: sha256sum *.AppImage > "$(ls *.AppImage).sha256"

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.AppImage.sha256
          generate_release_notes: true

  windows:
    name: Windows zip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p groovy

      # Unsigned for now: Windows will show a SmartScreen warning on first run.
      - name: Zip the program
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $dir = "dist/Groovy-$version-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item target/release/groovy.exe "$dir/groovy.exe"
          Copy-Item LICENSE-MIT, LICENSE-APACHE $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"

      - name: Write the checksum
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/*.zip | Select-Object -First 1
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($zip.Name)" | Set-Content -NoNewline -Encoding ascii "$($zip.FullName).sha256"

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.zip.sha256
          generate_release_notes: true
