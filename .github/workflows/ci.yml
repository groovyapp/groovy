name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Line tables keep file and line numbers in backtraces, and make the test binaries several
  # times smaller. With full debug info the workspace fills the runner's disk.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      # The runner comes with SDKs this project does not use, and the build needs the room.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libfontconfig-dev libwayland-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libvulkan-dev libssl-dev libzstd-dev libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
        env:
          # The node tests print these only for a test that fails.
          RUST_LOG: groovy_core=debug,iroh_docs=debug,iroh_gossip=info,warn

      - name: Build
        run: cargo build --release --workspace

  # The oldest toolchain that builds the workspace. The pinned GPUI needs it;
  # see the README. Raising it is a deliberate change, made here and in the README.
  msrv:
    name: Minimum supported Rust (1.99.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libfontconfig-dev libwayland-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libvulkan-dev libssl-dev libzstd-dev libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@1.99.0

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --workspace --all-targets

  # Licenses, known vulnerabilities, and sources. Configured in deny.toml.
  deny:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

