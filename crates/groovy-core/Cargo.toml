[package]
name = "groovy-core"
description = "Groovy's UI-free core: networking, storage and messaging services"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
directories = "6"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
toml = "1"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
