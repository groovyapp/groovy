[package]
name = "gpui-template"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/danielkosgei/gpui-template"

[dependencies]
gpui = "0.2.2"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.61.3", features = ["Wdk_System_SystemServices", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_SystemInformation"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"
