[workspace]
resolver = "3"
members = ["crates/groovy", "crates/groovy-cli", "crates/groovy-core"]
# `cargo run` and `cargo build` at the root build the desktop app.
default-members = ["crates/groovy"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/groovyapp/groovy"

[workspace.dependencies]
# Pinned to a Zed commit rather than a crates.io release, for the latest GPUI.
# Bump the rev deliberately; `cargo update -p gpui` will not move it.
gpui = { git = "https://github.com/zed-industries/zed", rev = "56934ec0560bce8929025497411de7f5322fb6ca" }
# The Wayland and X11 backends are off unless enabled here; without them the app
# starts headless and never opens a window.
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "56934ec0560bce8929025497411de7f5322fb6ca", features = ["wayland", "x11"] }
